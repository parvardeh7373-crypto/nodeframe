<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;400;500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#02030a;
    font-family:'Vazirmatn',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:white;
}

/* ===== Animated Background ===== */

.space{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.stars{
    position:absolute;
    width:200%;
    height:200%;
    background-image:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent),
    radial-gradient(2px 2px at 40px 70px,#00fff2,transparent),
    radial-gradient(1px 1px at 90px 40px,#fff,transparent),
    radial-gradient(2px 2px at 160px 120px,#8b5cf6,transparent),
    radial-gradient(1px 1px at 230px 200px,#fff,transparent);
    background-size:250px 250px;
    animation:starsMove 120s linear infinite;
    opacity:.7;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-500px);
    }
}

/* ===== Glowing Rings ===== */

.ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.08);
    animation:rotate 20s linear infinite;
}

.ring1{
    width:900px;
    height:900px;
    border-top:2px solid #00fff2;
    box-shadow:0 0 80px #00fff233;
}

.ring2{
    width:650px;
    height:650px;
    border-bottom:2px solid #8b5cf6;
    animation-direction:reverse;
}

.ring3{
    width:450px;
    height:450px;
    border-left:2px solid #00ff88;
    animation-duration:12s;
}

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* ===== Glass Card ===== */

.container{
    position:relative;
    z-index:10;
    width:92%;
    max-width:1000px;
    padding:80px 70px;
    border-radius:40px;
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.08);
    overflow:hidden;
    box-shadow:
    0 0 100px rgba(0,255,255,.08),
    inset 0 0 50px rgba(255,255,255,.03);
}

/* animated border */

.container::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
    linear-gradient(
    45deg,
    #00fff2,
    #8b5cf6,
    #00ff88,
    #00fff2
    );
    z-index:-1;
    filter:blur(20px);
    opacity:.5;
    animation:borderGlow 8s linear infinite;
}

@keyframes borderGlow{
    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }
}

/* ===== Logo ===== */

.logo{
    width:130px;
    height:130px;
    margin:auto;
    margin-bottom:40px;
    border-radius:35px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    font-weight:bold;
    font-family:'Orbitron',sans-serif;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:
    0 0 40px rgba(0,255,242,.25),
    inset 0 0 30px rgba(255,255,255,.04);
}

.logo::before{
    content:"";
    position:absolute;
    inset:-12px;
    border-radius:40px;
    border:2px solid rgba(0,255,242,.3);
    animation:pulse 3s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    100%{
        transform:scale(1.15);
        opacity:0;
    }

}

/* ===== Text ===== */

.small{
    text-align:center;
    color:#00fff2;
    letter-spacing:5px;
    margin-bottom:25px;
    font-size:14px;
    text-transform:uppercase;
}

h1{
    text-align:center;
    font-size:80px;
    line-height:1.2;
    margin-bottom:25px;
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(to left,#ffffff,#00fff2,#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 30px rgba(0,255,242,.2);
}

.desc{
    text-align:center;
    color:#94a3b8;
    max-width:760px;
    margin:auto;
    line-height:2.3;
    font-size:18px;
    margin-bottom:55px;
}

/* ===== Loading ===== */

.loading-box{
    width:100%;
    max-width:700px;
    margin:auto;
}

.loading-text{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    color:#e2e8f0;
    font-size:15px;
}

.bar{
    width:100%;
    height:20px;
    background:rgba(255,255,255,.05);
    border-radius:100px;
    overflow:hidden;
    position:relative;
}

.progress{
    width:0%;
    height:100%;
    border-radius:100px;
    background:
    linear-gradient(
    90deg,
    #00fff2,
    #8b5cf6,
    #00ff88
    );
    box-shadow:
    0 0 30px #00fff2,
    0 0 60px #8b5cf6;
    position:relative;
    overflow:hidden;
}

.progress::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.7),
    transparent
    );

    animation:shine 2s infinite;
}

@keyframes shine{

    100%{
        left:100%;
    }

}

/* ===== Bottom Status ===== */

.status{
    margin-top:45px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.status-box{
    padding:15px 25px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    color:#cbd5e1;
    font-size:14px;
    backdrop-filter:blur(10px);
}

/* ===== Floating Orbs ===== */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
}

.orb1{
    width:300px;
    height:300px;
    background:#00fff2;
    top:-80px;
    right:-80px;
}

.orb2{
    width:350px;
    height:350px;
    background:#8b5cf6;
    bottom:-120px;
    left:-100px;
}

.orb3{
    width:250px;
    height:250px;
    background:#00ff88;
    top:50%;
    left:50%;
}

/* ===== Responsive ===== */

@media(max-width:850px){

    .container{
        padding:50px 25px;
    }

    h1{
        font-size:42px;
    }

    .desc{
        font-size:15px;
    }

    .logo{
        width:100px;
        height:100px;
        font-size:40px;
    }

}

</style>
</head>
<body>

<div class="space">
    <div class="stars"></div>
</div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">

    <div class="logo">
        ∞
    </div>

    <div class="small">
        SYSTEM UPGRADE
    </div>

    <h1>
        COMING SOON
    </h1>

    <div class="desc">
        ما در حال ساخت نسل جدید وب‌سایت هستیم.
        تجربه‌ای فوق‌العاده سریع، مدرن و آینده‌نگر
        که هر چیزی را متفاوت خواهد کرد.
    </div>

    <div class="loading-box">

        <div class="loading-text">
            <span>در حال آماده‌سازی سیستم</span>
            <span id="percent">0%</span>
        </div>

        <div class="bar">
            <div class="progress"></div>
        </div>

    </div>

    <div class="status">

        <div class="status-box">
            UI Upgrade
        </div>

        <div class="status-box">
            AI System Active
        </div>

        <div class="status-box">
            Security Enhanced
        </div>

    </div>

</div>

<script>

const progress = document.querySelector(".progress");
const percent = document.getElementById("percent");

let count = 0;

const loading = setInterval(()=>{

    count++;

    progress.style.width = count + "%";
    percent.innerHTML = count + "%";

    if(count >= 100){

        clearInterval(loading);

        percent.innerHTML = "READY";

    }

},70);

</script>

</body>
</html>
